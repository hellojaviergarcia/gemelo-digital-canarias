p{margin:6px 0 10px;font-size:14px;line-height:1.5;color:var(--mute)}

.row{margin:12px 0}
label,legend{display:block;font-size:13px;margin-bottom:4px}
fieldset{border:0;padding:0;margin:12px 0}
input[type=range],input[type=search]{width:100%}
input[type=range]{accent-color:var(--lava)}
input[type=search]{font:inherit;font-size:14px;padding:6px 8px;background:#0b1a17;color:var(--ink);border:1px solid var(--line)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--sea);padding:6px 10px;cursor:pointer}
button:hover,button[aria-pressed=true]{background:var(--sea);color:#06201d}
:focus-visible{outline:2px solid var(--lava);outline-offset:2px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;margin:0 10px 4px 0}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
#info{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:14px;line-height:1.5;display:none}
#info h2{font-size:16px;margin:0 0 4px}
#info .dato{margin-top:6px;color:var(--lava);font-weight:700}
#info small{color:var(--mute);display:block;margin-top:4px}
#status{font-size:12px;color:var(--mute);margin-top:10px}
#caption{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);max-width:min(640px,90%);background:rgba(16,35,31,.92);padding:10px 16px;font-size:16px;text-align:center;z-index:4;display:none;border-bottom:3px solid var(--lava)}

  <div id="info"></div>
  <div id="status"></div>

</div>

Names (casco urbano)", "Puerto Rico": "GeoNames (casco urbano)", "Playa del Inglés": "GeoNames (casco urbano)", "Tegueste": "GeoNames (casco urbano)", "Los Silos": "GeoNames (casco urbano)", "Guía de Isora": "GeoNames (casco urbano)", "Arona (Los Cristianos)": "GeoNames (casco urbano)", "Fasnia": "GeoNames (casco urbano)", "Arafo": "GeoNames (casco urbano)", "Tanque": "GeoNames (casco urbano)", "La Victoria de Acentejo": "GeoNames (casco urbano)", "La Matanza de Acentejo": "GeoNames (casco urbano)", "La Guancha": "GeoNames (casco urbano)", "Granadilla de Abona": "GeoNames (casco urbano)", "San Miguel de Abona": "GeoNames (casco urbano)", "Santa Úrsula": "GeoNames (casco urbano)", "El Sauzal": "GeoNames (casco urbano)", "San Juan de la Rambla": "GeoNames (casco urbano)", "Los Realejos": "GeoNames (casco urbano)", "Alajeró": "GeoNames (casco urbano)", "Breña Alta": "GeoNames (casco urbano)", "Breña Baja": "GeoNames (casco urbano)", "Puntallana": "GeoNames (casco urbano)", "Tijarafe": "GeoNames (casco urbano)", "Puntagorda": "GeoNames (casco urbano)", "Barlovento": "GeoNames (casco urbano)", "Caleta de Sebo": "Wikipedia", "Casas de Pedro Barba": "Wikipedia", "Montaña Amarilla": "IGN (vértice geodésico)", "Agujas Grandes": "SummitPost", "Playa de las Conchas": "OpenStreetMap", "Playa de la Francesa": "Wikivoyage / mondo.surf (aprox.)"};
POIS.forEach(p=>p.c=COORD[p.n]||'Aproximada, sin verificar');
const ISLINFO={
"La Palma":{t:"Isla joven y volcánica, con el mayor desnivel de Canarias entre la costa y su techo.",dato:"708 km². Techo: Roque de los Muchachos, 2.426 m. Conquista: 1493."},
"El Hierro":{t:"La más pequeña y occidental, considerada el fin del mundo conocido en la Antigüedad.",dato:"269 km². Techo: Malpaso, 1.501 m. Conquista: 1405."},
"La Gomera":{t:"Isla circular tallada por profundos barrancos, con el Silbo Gomero, lenguaje silbado Patrimonio Inmaterial de la UNESCO desde 2009.",dato:"369 km². Techo: Garajonay, 1.487 m."},
"Tenerife":{t:"La mayor isla del archipiélago, dominada por el Teide.",dato:"2.034 km². Techo: Teide, 3.715 m. Conquista: 1496."},
"Gran Canaria":{t:"Isla casi circular, con gran diversidad de climas y paisajes en poco espacio.",dato:"1.560 km². Techo: Morro de la Agujereada, 1.956 m. Conquista: 1483."},
"Fuerteventura":{t:"La más antigua y árida, con las playas más extensas del archipiélago.",dato:"1.660 km². Techo: Pico de la Zarza, 807 m. Conquista: 1405."},
"Lanzarote":{t:"Isla volcánica de paisaje lunar, modelada por las erupciones del siglo XVIII y por César Manrique.",dato:"846 km². Techo: Peñas del Chache, 671 m. Conquista: 1402."},
"La Graciosa":{t:"Isla volcánica de unos 29 km² al norte de Lanzarote, separada por el estrecho de El Río. Sus calles son de arena y casi no hay vehículos.",dato:"Es oficialmente la octava isla de Canarias desde 2018. Techo: Agujas Grandes, 266 m."},
"Canarias":{t:"Ocho islas de origen volcánico en el Atlántico, a unos 100 km de África en su punto más cercano.",dato:"Unos 7.450 km². Población aborigen: guanches y otros pueblos, de origen amazigh."}
};
const COL={Volcán:"#e8552d",Yacimiento:"#e3b341",Naturaleza:"#5fbf6e",Patrimonio:"#4aa3df",Ciencia:"#c58cf0"};
const ISL={"La Palma":[-17.87,28.65,60000],"El Hierro":[-18.0,27.75,50000],"La Gomera":[-17.2,28.1,50000],
 "Tenerife":[-16.6,28.3,90000],"Gran Canaria":[-15.6,27.95,80000],"Fuerteventura":[-14.0,28.4,110000],
 "Lanzarote":[-13.65,29.0,80000],"La Graciosa":[-13.508,29.25,22000],"Canarias":[-15.9,28.3,700000]};

/* ===== VISOR ===== */
const $=id=>document.getElementById(id);
const hasToken=TOKEN&&!TOKEN.startsWith("TU_");
let viewer;
if(hasToken){Cesium.Ion.defaultAccessToken=TOKEN;
  viewer=new Cesium.Viewer("c",{terrain:Cesium.Terrain.fromWorldTerrain(),baseLayerPicker:false,geocoder:false,timeline:false,
   animation:false,sceneModePicker:false,navigationHelpButton:false,homeButton:false,infoBox:false,selectionIndicator:false});
}else{
  viewer=new Cesium.Viewer("c",{baseLayer:new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({url:"https://tile.openstreetmap.org/"})),
   baseLayerPicker:false,geocoder:false,timeline:false,animation:false,sceneModePicker:false,navigationHelpButton:false,
   homeButton:false,infoBox:false,selectionIndicator:false});
  $("status").textContent="Modo sin token: mapa plano. Añade tu token de Cesium Ion para activar el terreno 3D.";
}
const base=viewer.imageryLayers.get(0);
viewer.scene.globe.enableLighting=false;
viewer.scene.globe.baseColor=Cesium.Color.fromCssColorString("#1d3a34");
viewer.scene.globe.depthTestAgainstTerrain=hasToken;
if(hasToken)viewer.scene.verticalExaggeration=1.5;

function fp(f){return new Promise(r=>f(r));}
const fly=(k,dur=3)=>{const [lo,la,h]=ISL[k];
  return fp(done=>viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lo,la-h*(hasToken?1:.364)/111320,h),
   orientation:{heading:0,pitch:Cesium.Math.toRadians(hasToken?-45:-70)},duration:dur,complete:done,cancel:done}));};

/* ===== MAPAS HISTÓRICOS ===== */
const capas=MAPAS.filter(m=>m.url).map(m=>{
  const l=viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({url:m.url,maximumLevel:12}));
  l.show=false;l.alpha=.7;return {l,m};});

/* ===== PUNTOS ===== */
const ents=POIS.map(p=>{
  const e=viewer.entities.add({
    position:Cesium.Cartesian3.fromDegrees(p.lon,p.lat),
    point:{pixelSize:12,color:Cesium.Color.fromCssColorString(COL[p.tipo]),outlineColor:Cesium.Color.WHITE,outlineWidth:2,
     heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:Number.POSITIVE_INFINITY},
    label:{text:p.n,font:"14px Georgia",fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,
     style:Cesium.LabelStyle.FILL_AND_OUTLINE,pixelOffset:new Cesium.Cartesian2(0,-18),
     heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
     distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,220000),disableDepthTestDistance:Number.POSITIVE_INFINITY}});
  e._p=p;return e;});

/* ===== RECONSTRUCCIONES 3D ESQUEMÁTICAS (aldea aborigen junto a Gáldar, antes de 1500) ===== */
const recon=[];
(function(){
  const cx=-15.6510,cy=28.1470,M=111320,mk=(dx,dy)=>Cesium.Cartesian3.fromDegrees(cx+dx/(M*Math.cos(cy*Math.PI/180)),cy+dy/M);
  const piedra=Cesium.Color.fromCssColorString("#8a7a63"),paja=Cesium.Color.fromCssColorString("#b79a5b");
  for(let i=0;i<12;i++){const a=i/12*2*Math.PI;
    recon.push(viewer.entities.add({position:mk(Math.cos(a)*14,Math.sin(a)*14),
      cylinder:{length:1.4,topRadius:.7,bottomRadius:.9,material:piedra,heightReference:Cesium.HeightReference.CLAMP_TO_GROUND}}));}
  [[-35,10],[-40,-12],[35,22],[42,-6],[0,-38]].forEach(([x,y])=>
    recon.push(viewer.entities.add({position:mk(x,y),ellipsoid:{radii:new Cesium.Cartesian3(5,5,2.6),material:paja,
      heightReference:Cesium.HeightReference.CLAMP_TO_GROUND}})));
  const lab=viewer.entities.add({position:mk(0,0),label:{text:"Reconstrucción esquemática: tagoror y viviendas",font:"13px Georgia",
    fillColor:Cesium.Color.WHITE,outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,
    pixelOffset:new Cesium.Cartesian2(0,-30),distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,3000),
    disableDepthTestDistance:Number.POSITIVE_INFINITY,heightReference:Cesium.HeightReference.CLAMP_TO_GROUND}});
  recon.push(lab);
})();

/* ===== ÉPOCA Y FILTROS ===== */
const activos=new Set(Object.keys(COL));
const eraName=y=>y>=2020?"Hoy":y<1496?"Conquista, c. "+y:y<1700?"Siglos XVI-XVII, "+y:y<1800?"Siglo XVIII, "+y:y<1900?"Siglo XIX, "+y:"Siglo XX, "+y;
function aplicar(y){
  y=+y;$("yv").textContent=y;$("era").textContent=eraName(y);$("year").value=y;
  ents.forEach(e=>e.show=y>=e._p.d&&y<=e._p.h&&activos.has(e._p.tipo));
  recon.forEach(e=>e.show=y<1500);
  capas.forEach(({l,m})=>l.show=y>=m.desde&&y<=m.hasta);
  const t=Math.max(0,Math.min(1,(2026-y)/600));
  base.saturation=1-.75*t;base.hue=.08*t;base.brightness=1-.12*t;base.contrast=1+.1*t; // tono de archivo
  document.querySelectorAll("#eras button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.y===y)));
}
$("year").oninput=e=>aplicar(e.target.value);
document.querySelectorAll("#eras button").forEach(b=>b.onclick=()=>aplicar(b.dataset.y));
Object.keys(COL).forEach(k=>{const l=document.createElement("label");l.className="chk";
  l.innerHTML=`<input type="checkbox" checked><span class="dot" style="background:${COL[k]}"></span>`;
  l.append(k);l.firstChild.onchange=ev=>{ev.target.checked?activos.add(k):activos.delete(k);aplicar($("year").value);};
  $("types").appendChild(l);});
Object.keys(ISL).forEach(k=>{const b=document.createElement("button");b.textContent=k;b.onclick=()=>{stopTour();fly(k);const x=ISLINFO[k];ficha({n:k,t:x.t,dato:x.dato});};$("isl").appendChild(b);});
POIS.forEach(p=>{const o=document.createElement("option");o.value=p.n;$("names").appendChild(o);});

/* ===== FICHAS ===== */
function ficha(p){
  const i=$("info");i.style.display="block";i.innerHTML="<h2></h2><div></div><div class='dato'></div><small></small>";
  i.querySelector("h2").textContent=p.is?p.n+" · "+p.is:p.n;
  i.querySelector("div").textContent=p.t;
  i.querySelector(".dato").textContent=p.dato||"";
  i.querySelector("small").textContent=(p.tipo?p.tipo+" · ":"")+(p.f?"Fuente: "+p.f:"")+(p.c?" · Coordenada: "+p.c:"");}
const RANGO={"Teide":17000,"Caldera de Taburiente":16000,"Montañas del Fuego (Timanfaya)":14000,"Parque Rural de Anaga":18000,
"Parque Nacional de Garajonay":12000,"Dunas de Maspalomas":6000,"Dunas de Corralejo":9000,"La Geria":9000,"Macizo de Teno (Masca)":9000,
"Playa de Cofete":9000,"Cueva Pintada (Gáldar)":900,"Volcán submarino Tagoro":9000,"Roque Nublo":5000,"Montaña de Tindaya":6000,"El Sabinar":6000};
const rango=p=>RANGO[p.n]||({Patrimonio:3500,Yacimiento:3000,Ciencia:4500,Volcán:9000,Naturaleza:9000}[p.tipo]||5000);
async function objetivo(p){let h=0;
  if(hasToken){try{const [c]=await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider,[Cesium.Cartographic.fromDegrees(p.lon,p.lat)]);h=c.height||0;}catch(_){}}
  return Cesium.Cartesian3.fromDegrees(p.lon,p.lat,h);}
function mira(c,p,grados,dur){
  return fp(done=>viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(c,100),
   {offset:new Cesium.HeadingPitchRange(Cesium.Math.toRadians(grados),Cesium.Math.toRadians(hasToken?-35:-70),rango(p)),
    duration:dur,complete:done,cancel:done}));}
async function ir(e,dur=3){const p=e._p;ficha(p);const c=await objetivo(p);await mira(c,p,15,dur);return c;}
new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas).setInputAction(c=>{
  const o=viewer.scene.pick(c.position);if(o&&o.id&&o.id._p){stopTour();ir(o.id);}},Cesium.ScreenSpaceEventType.LEFT_CLICK);
$("q").onchange=e=>{const x=ents.find(z=>z._p.n.toLowerCase()===e.target.value.toLowerCase());
  if(x){stopTour();aplicar(Math.max(+$("year").value,x._p.d));ir(x);}};
$("min").onclick=()=>{const m=$("panel").classList.toggle("min");$("min").textContent=m?"+":"–";};

/* ===== RECORRIDO GUIADO ===== */
let tourOn=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cap=t=>{$("caption").style.display=t?"block":"none";$("caption").textContent=t||"";};
function stopTour(){tourOn=false;cap("");viewer.camera.cancelFlight();}
const ORDEN=["La Palma","El Hierro","La Gomera","Tenerife","Gran Canaria","Lanzarote","La Graciosa","Fuerteventura"];
async function tourCompleto(){
  tourOn=true;
  for(const k of ORDEN){
    if(!tourOn)break;
    aplicar(2026);cap(k+": "+ISLINFO[k].t);ficha({n:k,t:ISLINFO[k].t,dato:ISLINFO[k].dato});
    await fly(k,4);if(!tourOn)break;await sleep(4500);
    for(const e of ents.filter(z=>z._p.is===k)){
      if(!tourOn)break;const p=e._p;
      aplicar(Math.max(p.d,1494));cap(p.n+": "+(p.dato||p.t));
      const c=await ir(e,3.5);if(!tourOn)break;
      await mira(c,p,115,6);}
  }
  stopTour();
}
$("tourAll").onclick=()=>{if(!tourOn)tourCompleto();};
$("stop").onclick=stopTour;

aplicar(2026);fly("La Palma");
</script>
